version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php ./vendor/bin/roadrunner-worker"
  relay: pipes

http:
  address: 0.0.0.0:8080
  middleware: [ "gzip" ]
  pool:
    num_workers: 4
    max_jobs: 1000
    supervisor:
      exec_ttl: 60s

logs:
  mode: production
  level: info
  output: stderr
  err_output: stderr